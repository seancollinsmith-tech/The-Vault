<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault — Spanner Sports</title>

<!-- Open Graph / social preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="The Vault — Spanner Sports">
<meta property="og:description" content="A Deal or No Deal-style game built from real NBA career stats. Pick a case, weigh the banker's offer, and see if you should hold or fold.">
<meta property="og:image" content="https://spannersports-the-vault.vercel.app/og-image.png">
<meta property="og:url" content="https://spannersports-the-vault.vercel.app/">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Vault — Spanner Sports">
<meta name="twitter:description" content="A Deal or No Deal-style game built from real NBA career stats. Pick a case, weigh the banker's offer, and see if you should hold or fold.">
<meta name="twitter:image" content="https://spannersports-the-vault.vercel.app/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --vault-black:#0b120e;
    --vault-green:#10241a;
    --vault-green-2:#173427;
    --brass:#c9a04d;
    --brass-bright:#e9c873;
    --cream:#f2ead6;
    --cream-dim:#c7c0ad;
    --ember:#c1440e;
    --win:#3f8f5f;
    --line:rgba(201,160,77,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,160,77,0.10), transparent 60%),
      var(--vault-black);
    color:var(--cream);
    font-family:'Oswald',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
    overflow-x:hidden;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
    margin-bottom:22px;
  }
  .brand-eyebrow{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(28px,4vw,44px);
    margin:0;
    color:var(--cream);
    letter-spacing:0.01em;
  }
  h1 span{color:var(--brass-bright);font-style:normal;}
  h1#homeLogo{transition:opacity .15s;}
  h1#homeLogo:hover{opacity:0.75;}
  .header-actions{display:flex;gap:10px;flex-wrap:wrap;}

  button{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-size:13px;
    cursor:pointer;
    border-radius:3px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--cream-dim);
    padding:10px 16px;
    transition:border-color .15s, color .15s, background .15s;
  }
  button:hover{border-color:var(--brass);color:var(--cream);}
  button:focus-visible{outline:2px solid var(--brass-bright);outline-offset:2px;}
  button.primary{
    background:var(--brass);
    border-color:var(--brass);
    color:#1a1005;
  }
  button.primary:hover{background:var(--brass-bright);border-color:var(--brass-bright);}
  button.ghost-ember{border-color:rgba(193,68,14,0.4);color:#e08a5f;}
  button.ghost-ember:hover{border-color:var(--ember);color:#ffb389;}
  button:disabled{opacity:0.35;cursor:not-allowed;}
  button:disabled:hover{border-color:var(--line);color:var(--cream-dim);background:transparent;}

  /* ---------- Status strip ---------- */
  .status-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    background:var(--vault-green);
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 20px;
    margin-bottom:22px;
  }
  .status-block{display:flex;flex-direction:column;gap:2px;}
  .status-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--cream-dim);}
  .status-value{font-size:18px;font-weight:600;color:var(--brass-bright);font-variant-numeric:tabular-nums;}

  /* ---------- Board grid ---------- */
  .game-area{
    display:flex;
    gap:24px;
    align-items:flex-start;
    flex-wrap:nowrap;
    margin-bottom:24px;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
    gap:10px;
    flex:1 1 auto;
    min-width:0;
  }

  /* ---------- Value ladder ---------- */
  .ladder{
    flex:0 0 260px;
    display:flex;
    gap:8px;
  }
  .ladder-col{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .ladder-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    background:linear-gradient(90deg,var(--vault-green-2),var(--vault-green));
    border:1px solid var(--line);
    border-radius:3px;
    padding:5px 9px;
    font-size:12.5px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    color:var(--cream);
    transition:opacity .2s, background .2s, border-color .2s;
  }
  .ladder-row .lv-dollar{color:var(--brass);font-weight:600;}
  .ladder-row.struck{
    opacity:0.28;
    background:var(--vault-black);
    border-color:rgba(201,160,77,0.08);
  }
  .ladder-row.struck .lv-value{text-decoration:line-through;text-decoration-color:var(--ember);}
  .ladder-row.struck .lv-dollar{color:var(--cream-dim);}
  .ladder-row.held-value{
    border-color:var(--brass-bright);
    box-shadow:0 0 0 1px var(--brass-bright);
  }
  @media (max-width:640px){
    .game-area{flex-direction:column;flex-wrap:nowrap;}
    .board{width:100%;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));}
    .ladder{flex:0 0 auto;width:100%;}
    .status-strip{gap:14px 22px;padding:14px 16px;}
    .case-num{font-size:9px;}
    .case-lock{font-size:16px;}
    body{padding-top:40px;}
  }
  .case-btn{
    aspect-ratio:1/1.15;
    background:linear-gradient(160deg,var(--vault-green-2),var(--vault-green));
    border:1px solid var(--line);
    border-radius:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:6px 4px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .case-btn::before{
    content:'';
    position:absolute;
    inset:6px;
    border:1px solid rgba(201,160,77,0.15);
    border-radius:4px;
    pointer-events:none;
  }
  .case-num{
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--brass);
    text-transform:uppercase;
  }
  .case-lock{font-size:20px;color:var(--brass-bright);}
  .case-btn:hover:not(:disabled){border-color:var(--brass-bright);transform:translateY(-2px);}
  .case-btn:disabled{cursor:default;}
  .case-btn.held{
    border-color:var(--brass-bright);
    box-shadow:0 0 0 1px var(--brass-bright), 0 0 18px rgba(233,200,115,0.25);
  }
  .case-btn.held::after{
    content:'YOUR CASE';
    position:absolute;
    bottom:6px;
    font-size:8px;
    letter-spacing:0.12em;
    color:var(--brass-bright);
    font-weight:600;
  }
  .case-btn.opened{
    background:linear-gradient(160deg,#1c1108,#150c05);
    border-color:rgba(193,68,14,0.35);
  }
  .case-btn.opened .case-player{
    font-family:'Fraunces',serif;
    font-size:11px;
    font-weight:600;
    color:var(--cream);
    line-height:1.15;
  }
  .case-btn.opened .case-value{
    font-family:'Oswald',sans-serif;
    font-size:11.5px;
    font-weight:600;
    color:var(--ember);
  }

  /* ---------- Panels (offer / final / setup) ---------- */
  .panel{
    background:var(--vault-green);
    border:1px solid var(--line);
    border-radius:6px;
    padding:26px;
    margin-bottom:24px;
  }
  .panel h2{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:22px;
    margin:0 0 14px;
    color:var(--cream);
  }
  .offer-amount{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(36px,6vw,56px);
    color:var(--brass-bright);
    letter-spacing:0.01em;
    margin:6px 0 18px;
    font-variant-numeric:tabular-nums;
  }
  .panel p{color:var(--cream-dim);line-height:1.6;font-size:15px;margin:0 0 18px;max-width:60ch;}
  .panel-actions{display:flex;gap:12px;flex-wrap:wrap;}

  /* ---------- Setup / edit table ---------- */
  .edit-table{width:100%;border-collapse:collapse;font-size:13px;}
  .edit-table th{
    text-align:left;
    font-size:10px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--brass);
    border-bottom:1px solid var(--line);
    padding:8px 8px;
  }
  .edit-table td{border-bottom:1px solid rgba(201,160,77,0.1);padding:6px 8px;}
  .edit-table input{
    width:100%;
    background:var(--vault-black);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--cream);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    padding:6px 8px;
  }
  .edit-table input:focus-visible{outline:2px solid var(--brass-bright);outline-offset:1px;}
  .edit-table input.val{text-align:right;font-variant-numeric:tabular-nums;}
  .table-scroll{max-height:420px;overflow-y:auto;margin-bottom:18px;border:1px solid var(--line);border-radius:4px;}

  /* ---------- Presets ---------- */
  .preset-block{
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:20px;
    background:rgba(201,160,77,0.04);
  }
  .preset-block h3{
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 12px;
  }
  .preset-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .preset-row:last-child{margin-bottom:0;}
  select, .preset-row input[type="text"], .preset-row input[type="email"], .preset-row input[type="password"]{
    background:var(--vault-black);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--cream);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    padding:9px 12px;
    min-width:180px;
  }
  select:focus-visible, .preset-row input:focus-visible{outline:2px solid var(--brass-bright);outline-offset:1px;}
  .preset-hint{font-size:11.5px;color:var(--cream-dim);margin:0;}
  .preset-status{font-size:11.5px;color:var(--brass-bright);margin:8px 0 0;min-height:14px;}

  /* ---------- Banker ringing ---------- */
  .ring-stage{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding:10px 0 4px;}

  /* ---------- Offer history sidebar (ringing + offer panels) ---------- */
  .offer-panel-body{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;}
  .offer-history-side{
    flex:0 0 200px;
    border-left:1px solid var(--line);
    padding-left:22px;
  }
  .offer-history-side h4{
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 10px;
  }
  .offer-history-side ul{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:180px;
    overflow-y:auto;
  }
  .offer-history-side li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    color:var(--cream-dim);
  }
  .offer-history-side li strong{color:var(--cream);font-weight:600;}
  .offer-history-side .round-tag{font-size:10.5px;color:var(--brass);letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
  @media (max-width:560px){
    .offer-history-side{flex:1 1 100%;border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:14px;}
  }
  .ring-badge{
    position:relative;
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:var(--vault-black);
    border:1px solid var(--brass);
  }
  .ring-badge::before, .ring-badge::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid var(--brass);
    animation:ringPulse 1.6s ease-out infinite;
  }
  .ring-badge::after{animation-delay:.5s;}
  .ring-glyph{font-size:26px;line-height:1;}
  @keyframes ringPulse{
    0%{transform:scale(1);opacity:0.9;}
    100%{transform:scale(2.1);opacity:0;}
  }
  .ring-text{font-size:13px;letter-spacing:0.15em;text-transform:uppercase;color:var(--cream-dim);}
  .ring-text .dots span{animation:ringDots 1.4s infinite;opacity:0;}
  .ring-text .dots span:nth-child(2){animation-delay:.2s;}
  .ring-text .dots span:nth-child(3){animation-delay:.4s;}
  .last-case-note{
    font-size:14px;
    color:var(--cream);
    background:rgba(201,160,77,0.08);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 14px;
  }
  .last-case-note strong{color:var(--brass-bright);font-weight:600;}
  @keyframes ringDots{0%{opacity:0;}30%{opacity:1;}60%{opacity:0;}100%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){
    .ring-badge::before, .ring-badge::after{animation:none;opacity:0.4;}
    .ring-text .dots span{animation:none;opacity:1;}
  }

  /* ---------- Deal history ---------- */
  .history-list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .history-list li{
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:13.5px;
    color:var(--cream-dim);
    border-bottom:1px solid rgba(201,160,77,0.12);
    padding-bottom:8px;
  }
  .history-list li strong{color:var(--ember);font-weight:600;}
  .history-list li span.round-tag{color:var(--brass);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;}

  /* ---------- Hero reveal ---------- */
  .hero-reveal-wrap{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin:18px 0 6px;
  }
  .hero-reveal{
    flex:1 1 240px;
    background:linear-gradient(160deg,var(--vault-green-2),var(--vault-black));
    border:1px solid var(--brass);
    border-radius:8px;
    padding:26px 22px;
    text-align:center;
    box-shadow:0 0 0 1px rgba(233,200,115,0.15), 0 0 30px rgba(233,200,115,0.12);
    animation:heroPop .5s cubic-bezier(.2,.8,.3,1.1) both;
  }
  .hero-reveal.dim{opacity:0.55;}
  .hero-tag{
    font-size:10px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 10px;
  }
  .hero-value{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(32px,5vw,52px);
    color:var(--brass-bright);
    line-height:1;
    margin:0 0 10px;
    font-variant-numeric:tabular-nums;
  }
  .hero-player{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    color:var(--cream);
    margin:0;
  }
  @keyframes heroPop{
    0%{opacity:0;transform:scale(0.88);}
    100%{opacity:1;transform:scale(1);}
  }
  @media (prefers-reduced-motion:reduce){
    .hero-reveal{animation:none;}
  }

  /* ---------- Finale overlay (grand reveal) ---------- */
  .finale-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(5,9,7,0.92);
    backdrop-filter:blur(3px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    overflow-y:auto;
    animation:finaleFade .35s ease both;
  }
  .finale-overlay.hidden{display:none;}
  @keyframes finaleFade{
    0%{opacity:0;}
    100%{opacity:1;}
  }
  .finale-overlay-inner{
    max-width:760px;
    width:100%;
    text-align:center;
  }
  .finale-eyebrow{
    font-size:11px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 8px;
  }
  .finale-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(26px,4vw,38px);
    color:var(--cream);
    margin:0 0 28px;
  }
  .finale-overlay .hero-reveal-wrap{margin:0 0 30px;}
  .finale-overlay .hero-reveal{
    flex:1 1 260px;
    padding:34px 24px;
  }
  .finale-overlay .hero-reveal:nth-child(2){animation-delay:.35s;}
  .finale-overlay .hero-value{font-size:clamp(38px,6vw,60px);}
  .hero-reveal.is-passed{
    border-color:rgba(193,68,14,0.55);
    box-shadow:0 0 0 1px rgba(193,68,14,0.22), 0 0 26px rgba(193,68,14,0.16);
  }
  .hero-reveal.is-passed .hero-value{color:var(--ember);}
  .hero-reveal.is-passed .hero-tag{color:#e08a5f;}
  .finale-history{
    max-width:420px;
    margin:22px auto 0;
    text-align:left;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .finale-history h4{
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 10px;
    text-align:center;
  }
  .finale-history.hidden{display:none;}
  @media (prefers-reduced-motion:reduce){
    .finale-overlay{animation:none;}
    .finale-overlay .hero-reveal:nth-child(2){animation-delay:0s;}
  }

  /* ---------- Big final-reveal trigger (briefcase-shaped) ---------- */
  .final-open-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:16px;
    padding:34px 16px 26px;
  }
  .final-case-btn{
    position:relative;
    width:220px;
    height:150px;
    margin-top:34px;
    border-radius:16px;
    background:linear-gradient(160deg,var(--vault-green-2),var(--vault-black) 75%);
    border:2px solid var(--brass);
    cursor:pointer;
    box-shadow:0 0 0 1px rgba(233,200,115,0.2), 0 0 44px rgba(233,200,115,0.18);
    transition:transform .15s, box-shadow .15s;
  }
  .final-case-btn::before{
    content:'';
    position:absolute;
    inset:8px;
    border:1px solid rgba(233,200,115,0.18);
    border-radius:10px;
    pointer-events:none;
  }
  .fcb-handle{
    position:absolute;
    top:-30px;
    left:50%;
    transform:translateX(-50%);
    width:76px;
    height:34px;
    border:5px solid var(--brass);
    border-bottom:none;
    border-top-left-radius:38px;
    border-top-right-radius:38px;
    background:var(--vault-black);
  }
  .fcb-lock{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-70%);
    width:30px;
    height:22px;
    background:var(--brass);
    border-radius:4px;
  }
  .fcb-lock::before{
    content:'';
    position:absolute;
    left:50%;
    top:-8px;
    transform:translateX(-50%);
    width:14px;
    height:12px;
    border:3px solid var(--brass);
    border-bottom:none;
    border-top-left-radius:8px;
    border-top-right-radius:8px;
  }
  .fcb-label{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:100%;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.1em;
    line-height:1.4;
    color:var(--brass-bright);
  }
  .final-case-btn:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 0 0 1px rgba(233,200,115,0.35), 0 0 60px rgba(233,200,115,0.3);
  }
  .final-case-btn:active{transform:scale(0.98);}
  .final-open-caption{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--cream-dim);
  }
  @media (prefers-reduced-motion:reduce){
    .final-case-btn{transition:none;}
  }

  footer{text-align:center;color:var(--cream-dim);font-size:11px;letter-spacing:0.08em;margin-top:30px;opacity:0.6;}

  @media (prefers-reduced-motion:reduce){
    .case-btn{transition:none;}
  }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildCasesFromBoard(board){
  const shuffled = shuffle(board);
  return shuffled.map((c,i)=>({
    num: i+1,
    value: c.value,
    player: c.player,
    opened: false,
  }));
}

/* ---------------------------------------------------------------
   RESULT IMAGE GENERATOR — draws a branded, shareable result card
   sized for Instagram/TikTok (1080x1920 vertical) using Canvas.
------------------------------------------------------------------*/
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawSpacedText(ctx, text, cx, y, spacing){
  // Manual letter-spacing fallback for broad canvas support.
  const chars = text.split('');
  let totalWidth = 0;
  chars.forEach(c => { totalWidth += ctx.measureText(c).width + spacing; });
  totalWidth -= spacing;
  let x = cx - totalWidth/2;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  chars.forEach(c => {
    ctx.fillText(c, x, y);
    x += ctx.measureText(c).width + spacing;
  });
  ctx.textAlign = prevAlign;
}

function drawResultCard(ctx, {x, y, w, h, tag, tagColor, value, valueColor, player}){
  ctx.save();
  ctx.shadowColor = 'rgba(233,200,115,0.25)';
  ctx.shadowBlur = 40;
  const grad = ctx.createLinearGradient(x, y, x+w, y+h);
  grad.addColorStop(0, '#173427');
  grad.addColorStop(1, '#0b120e');
  ctx.fillStyle = grad;
  roundRect(ctx, x, y, w, h, 22);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = tagColor;
  ctx.lineWidth = 3;
  roundRect(ctx, x, y, w, h, 22);
  ctx.stroke();

  const cx = x + w/2;
  ctx.textAlign = 'center';
  ctx.fillStyle = tagColor;
  ctx.font = '600 26px Oswald, sans-serif';
  drawSpacedText(ctx, tag.toUpperCase(), cx, y + 66, 3);

  ctx.fillStyle = valueColor;
  ctx.font = '700 92px Oswald, sans-serif';
  ctx.fillText(value, cx, y + h*0.58);

  ctx.fillStyle = '#f2ead6';
  ctx.font = 'italic 600 36px Fraunces, serif';
  ctx.fillText(player, cx, y + h - 40);
}

async function generateResultImage(payload){

  const W = 1080, H = 1920;

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#10241a');
  bg.addColorStop(1, '#0b120e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W/2, 260, 40, W/2, 260, 720);
  glow.addColorStop(0, 'rgba(201,160,77,0.14)');
  glow.addColorStop(1, 'rgba(201,160,77,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#c9a04d';
  ctx.font = '600 26px Oswald, sans-serif';
  drawSpacedText(ctx, 'SPANNER SPORTS · CAREER SCORE ENGINE', W/2, 170, 5);

  ctx.font = 'italic 600 96px Fraunces, serif';
  const theW = ctx.measureText('The ').width;
  const vaultW = ctx.measureText('Vault').width;
  const titleStart = W/2 - (theW + vaultW)/2;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#f2ead6';
  ctx.fillText('The ', titleStart, 300);
  ctx.fillStyle = '#e9c873';
  ctx.fillText('Vault', titleStart + theW, 300);
  ctx.textAlign = 'center';

  ctx.strokeStyle = 'rgba(201,160,77,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(140, 360);
  ctx.lineTo(W-140, 360);
  ctx.stroke();

  ctx.fillStyle = '#f2ead6';
  ctx.font = 'italic 600 64px Fraunces, serif';
  ctx.fillText(payload.mode === 'deal' ? 'Deal!' : 'The Reveal', W/2, 470);

  if(payload.mode === 'deal'){
    drawResultCard(ctx, {
      x: 130, y: 600, w: W-260, h: 420,
      tag: 'You banked', tagColor: '#c9a04d',
      value: payload.dealAmount, valueColor: '#e9c873',
      player: payload.caseLabel
    });
    if(payload.revealedPlayer){
      drawResultCard(ctx, {
        x: 130, y: 1060, w: W-260, h: 340,
        tag: 'What was inside', tagColor: '#c1440e',
        value: payload.revealedValue, valueColor: '#c1440e',
        player: payload.revealedPlayer
      });
    }
  } else {
    drawResultCard(ctx, {
      x: 130, y: 600, w: W-260, h: 400,
      tag: `Case #${payload.yourCaseNum} — your case`, tagColor: '#c9a04d',
      value: payload.yourValue, valueColor: '#e9c873',
      player: payload.yourPlayer
    });
    drawResultCard(ctx, {
      x: 130, y: 1040, w: W-260, h: 400,
      tag: `Case #${payload.passedCaseNum} — passed on`, tagColor: '#c1440e',
      value: payload.passedValue, valueColor: '#c1440e',
      player: payload.passedPlayer
    });
  }

  ctx.fillStyle = '#c9a04d';
  ctx.font = '600 22px Oswald, sans-serif';
  drawSpacedText(ctx, 'PLAY THE VAULT', W/2, 1780, 4);
  ctx.fillStyle = '#c7c0ad';
  ctx.font = '400 26px Oswald, sans-serif';
  ctx.fillText(PRODUCTION_URL.replace(/^https?:\/\//, ''), W/2, 1820);

  return canvas;
}

function canvasToBlob(canvas){
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function shareResultImage(payload, text, btnEl){
  const originalLabel = btnEl.textContent;
  try{
    const canvas = await generateResultImage(payload);
    const blob = await canvasToBlob(canvas);
    const file = new File([blob], 'the-vault-result.png', { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({ files: [file], text });
      } catch(err){
        if(err && err.name !== 'AbortError'){
          btnEl.textContent = 'Could not share';
          setTimeout(() => { btnEl.textContent = originalLabel; }, 2000);
        }
      }
      return;
    }
  } catch(e){
    // image generation failed — fall through to plain text share below
  }
  // Devices that can't share image files fall back to the existing text share.
  await doShare(text, btnEl);
}

async function doShare(text, btnEl){
  const originalLabel = btnEl.textContent;
  try{
    await navigator.share({ text });
  } catch(err){
    if(err && err.name !== 'AbortError'){
      btnEl.textContent = 'Could not share';
      setTimeout(() => { btnEl.textContent = originalLabel; }, 2000);
    }
    // AbortError = user closed the share sheet on purpose — no message needed
  }
}

async function doCopy(text, btnEl){
  const originalLabel = btnEl.textContent;
  try{
    if(!navigator.clipboard || !navigator.clipboard.writeText){
      throw new Error('Clipboard API unavailable');
    }
    await navigator.clipboard.writeText(text);
    btnEl.textContent = 'Copied!';
  } catch(e){
    // Fallback for older/restrictive browsers where the async Clipboard API
    // is blocked but the older execCommand copy still works.
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      btnEl.textContent = ok ? 'Copied!' : 'Could not copy';
    } catch(e2){
      btnEl.textContent = 'Could not copy';
    }
  }
  setTimeout(() => { btnEl.textContent = originalLabel; }, 2000);
}

function renderBoard(){

  gameArea.style.display='flex';

  el.innerHTML = '';
  state.cases.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'case-btn';
    if(c.num === state.heldCaseNum) btn.classList.add('held');
    if(c.opened) btn.classList.add('opened');

    const canPick = state.phase === 'pick' && !c.opened;
    const canOpen = state.phase === 'playing' && !c.opened && c.num !== state.heldCaseNum;
    btn.disabled = !(canPick || canOpen);

    if(c.opened){
      btn.innerHTML = `<span class="case-player">${c.player}</span><span class="case-value">${fmt(c.value)}</span>`;
    } else {
      btn.innerHTML = `<span class="case-num">Case</span><span class="case-lock">${c.num}</span>`;
    }

    btn.onclick = () => {
      if(canPick) pickCase(c.num);
      else if(canOpen) openCase(c.num);
    };
    el.appendChild(btn);
  });
}

function renderLadder(){
  const el = document.getElementById('ladder');
  if(state.phase === 'setup' || state.cases.length === 0){ el.innerHTML=''; return; }

  const heldCase = state.cases.find(c=>c.num===state.heldCaseNum);
  const heldValue = heldCase ? heldCase.value : null;

  const sortedValues = state.cases
    .map(c=>({ value:c.value, opened:c.opened, isHeld: c.num===state.heldCaseNum }))
    .sort((a,b)=>a.value-b.value);

  const half = Math.ceil(sortedValues.length/2);
  const leftCol = sortedValues.slice(0, half);
  const rightCol = sortedValues.slice(half);

  const rowHtml = (entry) => `
    <div class="ladder-row${entry.opened ? ' struck' : ''}${entry.isHeld && state.heldRevealed ? ' held-value' : ''}">
      <span class="lv-dollar">$</span><span class="lv-value">${entry.value.toLocaleString('en-US')}</span>

  el.innerHTML = `
    <div class="ladder-col">${leftCol.map(rowHtml).join('')}</div>
    <div class="ladder-col">${rightCol.map(rowHtml).join('')}</div>

      <tr>
        <td>${i+1}</td>
        <td><input type="text" data-idx="${i}" data-field="player" value="${c.player.replace(/"/g,'&quot;')}"></td>
        <td><input type="number" class="val" min="0" step="1" data-idx="${i}" data-field="value" value="${c.value}"></td>
      </tr>
    `).join('');

    rows.querySelectorAll('input').forEach(input=>{
      input.addEventListener('input', (e)=>{
        const idx = Number(e.target.dataset.idx);
        const field = e.target.dataset.field;
        state.editBoard[idx][field] = field === 'value' ? Number(e.target.value || 0) : e.target.value;
      });
    });

    document.getElementById('resetBoardBtn').onclick = () => {
      state.editBoard = DEFAULT_BOARD.map(c=>({...c}));
      render();
    };
    document.getElementById('signOutBtn').onclick = async () => { await adminSignOut(); };
  } else if(showAdminGate) {
    document.getElementById('adminSignInBtn').onclick = async () => {
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const statusEl = document.getElementById('authStatus');
      statusEl.textContent = 'Signing in…';
      const err = await adminSignIn(email, password);
      if(err){ statusEl.textContent = err; }
      // on success, onAuthStateChange re-renders this panel automatically
    };
  }

  document.getElementById('startGameBtn').onclick = () => startGame(state.editBoard);

  if(state.presetIndex !== null){
    document.getElementById('loadPresetBtn').onclick = () => {
      const sel = document.getElementById('presetSelect').value;
      if(sel) loadPresetByName(sel);
    };
    if(isAdmin){
      document.getElementById('deletePresetBtn').onclick = () => {
        const sel = document.getElementById('presetSelect').value;
        if(sel) deletePresetByName(sel);
      };
      document.getElementById('savePresetBtn').onclick = () => {
        const nameInput = document.getElementById('presetNameInput');
        savePresetAs(nameInput.value, state.editBoard);
      };
    }
  }
}

function renderOfferHistorySide(){
  if(!state.declinedOffers.length) return '';
  const recent = state.declinedOffers.slice(-4); // cap so it doesn't overflow
  return `
    <div class="offer-history-side">
      <h4>Previous offers</h4>
      <ul>
        ${recent.map(d => `<li><span class="round-tag">Rd ${d.round}</span><strong>${fmt(d.offer)}</strong></li>`).join('')}
      </ul>
    </div>
  `;
}

function renderOfferPanel(){
  const el = document.getElementById('offerPanel');

  if(state.phase === 'ringing'){
    const last = state.lastOpenedCase;
    el.innerHTML = `
      <div class="panel">
        <h2>The Banker</h2>
        <div class="offer-panel-body">
          <div class="ring-stage">
            <div class="ring-badge"><span class="ring-glyph">☎</span></div>
            <p class="ring-text">Incoming call<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
            ${last ? `<p class="last-case-note">Last case opened: <strong>${fmt(last.value)}</strong> — ${last.player}</p>` : ''}
          </div>
          ${renderOfferHistorySide()}
        </div>
      </div>
    `;
    return;
  }

  if(state.phase !== 'offer'){ el.innerHTML=''; return; }

  const last = state.lastOpenedCase;
  el.innerHTML = `
    <div class="panel">
      <h2>The banker is calling</h2>
      <p>${state.roundIndex+1 < ROUND_SCHEDULE.length ? `Round ${state.roundIndex+1} is done.` : 'This is the final offer.'} Based on what's left on the board, here's what the banker is offering to buy your case right now.</p>
      <div class="offer-panel-body">
        <div style="flex:1 1 260px;">
          <div class="offer-amount">${fmt(state.currentOffer)}</div>
          ${last ? `<p class="last-case-note">Last case opened: <strong>${fmt(last.value)}</strong> — ${last.player}</p>` : ''}
          <div class="panel-actions">
            <button class="primary" id="dealBtn">Deal</button>
            <button class="ghost-ember" id="noDealBtn">No deal</button>
          </div>
        </div>
        ${renderOfferHistorySide()}
      </div>
    </div>
  `;
  document.getElementById('dealBtn').onclick = takeDeal;
  document.getElementById('noDealBtn').onclick = declineDeal;
}

function renderFinalPanel(){
  const el = document.getElementById('finalPanel');
  if(state.phase !== 'final' && state.phase !== 'dealt'){ el.innerHTML=''; return; }

  const held = state.cases.find(c=>c.num===state.heldCaseNum);

  const historyHtml = state.declinedOffers.length ? `
    <h3 style="font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--brass);margin:20px 0 10px;">Offers you passed on</h3>
    <ul class="history-list">
      ${state.declinedOffers.map(d => `<li><span class="round-tag">Round ${d.round}</span> <strong>${fmt(d.offer)}</strong></li>`).join('')}
    </ul>
  ` : '';

  if(state.phase === 'dealt'){
    // The deal result is shown via the finale overlay (openDealOverlay,
    // triggered directly from takeDeal), not this inline panel.
    el.innerHTML = '';
    return;
  }

  // phase === 'final': one case left besides held case
  const lastOpen = state.cases.find(c=>!c.opened && c.num !== state.heldCaseNum);

  el.innerHTML = `
    <div class="panel">
      <h2>Final two cases</h2>
      <p>No deal, all the way. It's down to your case (#${held.num}) and case #${lastOpen.num}.</p>
      <div class="final-open-stage">
        <button class="final-case-btn" id="finalRevealBtn">
          <span class="fcb-handle"></span>
          <span class="fcb-lock"></span>
          <span class="fcb-label">OPEN<br>CASE #${held.num}</span>
        </button>
        <p class="final-open-caption">The moment of truth</p>
      </div>
      <div id="finalRevealSlot"></div>
      ${historyHtml}
    </div>
  `;
  document.getElementById('finalRevealBtn').onclick = () => {
    state.heldRevealed = true;
    lastOpen.opened = true;
    renderLadder();

    const overlay = document.getElementById('finaleOverlay');
    const inner = document.getElementById('finaleOverlayInner');
    const historyRows = state.declinedOffers.map(d =>
      `<li><span class="round-tag">Round ${d.round}</span> <strong>${fmt(d.offer)}</strong></li>`
    ).join('');
    const shareText = buildShareText({
      resultLine: `I opened Case #${held.num} — ${held.player}, worth ${fmt(held.value)}!`,
      passedLine: `The one I passed on, ${lastOpen.player}, was worth ${fmt(lastOpen.value)}.`
    });
    const imagePayload = {
      mode: 'final',
      yourCaseNum: held.num, yourValue: fmt(held.value), yourPlayer: held.player,
      passedCaseNum: lastOpen.num, passedValue: fmt(lastOpen.value), passedPlayer: lastOpen.player
    };

    inner.innerHTML = `
      <p class="finale-eyebrow">The Vault</p>
      <p class="finale-title">The Reveal</p>
      <div class="hero-reveal-wrap">
        <div class="hero-reveal is-yours">
          <p class="hero-tag">Case #${held.num} — your case</p>
          <p class="hero-value">${fmt(held.value)}</p>
          <p class="hero-player">${held.player}</p>
        </div>
        <div class="hero-reveal is-passed">
          <p class="hero-tag">Case #${lastOpen.num} — the one you passed on</p>
          <p class="hero-value">${fmt(lastOpen.value)}</p>
          <p class="hero-player">${lastOpen.player}</p>
        </div>
      </div>
      <div class="panel-actions" style="justify-content:center;">
        <button class="primary" id="playAgainBtn2">Play again</button>
        ${state.declinedOffers.length ? '<button id="viewHistoryBtn2">View offer history</button>' : ''}
        <button id="shareResultBtn2" ${navigator.share ? '' : 'style="display:none;"'}>Share</button>
        <button id="copyResultBtn2">Copy result</button>
      </div>
      ${state.declinedOffers.length ? `
        <div class="finale-history hidden" id="finaleHistory2">
          <h4>Offers you passed on</h4>
          <ul class="history-list">${historyRows}</ul>
        </div>
      ` : ''}
    `;
    overlay.classList.remove('hidden');
    document.getElementById('playAgainBtn2').onclick = () => {
      overlay.classList.add('hidden');
      startGame(state.editBoard);
    };
    if(state.declinedOffers.length){
      document.getElementById('viewHistoryBtn2').onclick = (e) => {
        const hist = document.getElementById('finaleHistory2');
        hist.classList.toggle('hidden');
        e.target.textContent = hist.classList.contains('hidden') ? 'View offer history' : 'Hide offer history';
      };
    }
    document.getElementById('shareResultBtn2').onclick = (e) => shareResultImage(imagePayload, shareText, e.target);
    document.getElementById('copyResultBtn2').onclick = (e) => doCopy(shareText, e.target);
  };
}

/* ---------------------------------------------------------------
   GAME LOGIC
------------------------------------------------------------------*/
function startGame(board){
  if(!board || board.length < 3){ return; }
  state.cases = buildCasesFromBoard(board);
  state.heldCaseNum = null;
  state.roundIndex = 0;
  state.casesOpenedThisRound = 0;
  state.currentOffer = 0;
  state.dealAcceptedValue = null;
  state.heldRevealed = false;
  state.declinedOffers = [];
  state.pendingOfferCases = null;
  state.lastOpenedCase = null;
  state.phase = 'pick';
  render();
}

function pickCase(num){
  state.heldCaseNum = num;
  state.phase = 'playing';
  render();
}

function openCase(num){
  const c = state.cases.find(x=>x.num===num);
  if(!c || c.opened) return;
  c.opened = true;
  state.lastOpenedCase = { player: c.player, value: c.value };
  state.casesOpenedThisRound++;

  const remainingUnopened = state.cases.filter(x=>!x.opened && x.num!==state.heldCaseNum);

  // Round complete?
  if(state.casesOpenedThisRound >= ROUND_SCHEDULE[state.roundIndex]){
    // If only 1 case remains besides held case, skip straight to final reveal (no more offers)
    if(remainingUnopened.length <= 1){
      state.phase = 'final';
      render();
      return;
    }
    triggerRing(remainingUnopened);
    return;
  }

  render();
}

function triggerRing(remainingUnopened){
  state.pendingOfferCases = remainingUnopened;
  state.phase = 'ringing';
  render();
  setTimeout(()=>{
    if(state.phase !== 'ringing') return; // player navigated away mid-ring
    state.currentOffer = computeOffer(state.pendingOfferCases);
    state.phase = 'offer';
    render();
  }, 2200);
}

function computeOffer(remainingUnopened){
  const avg = remainingUnopened.reduce((s,c)=>s+c.value,0) / remainingUnopened.length;
  const mult = ROUND_MULTIPLIER[Math.min(state.roundIndex, ROUND_MULTIPLIER.length-1)];
  return Math.round((avg * mult) / 100) * 100;
}

function takeDeal(){
  state.dealAcceptedValue = state.currentOffer;
  state.phase = 'dealt';
  render();
  openDealOverlay();
}

function openDealOverlay(){
  const held = state.cases.find(c=>c.num===state.heldCaseNum);
  const overlay = document.getElementById('finaleOverlay');
  const inner = document.getElementById('finaleOverlayInner');
  const dealtShareText = buildShareText({
    resultLine: `I took the deal in The Vault and banked ${fmt(state.dealAcceptedValue)}!`
  });
  const historyRows = state.declinedOffers.map(d =>
    `<li><span class="round-tag">Round ${d.round}</span> <strong>${fmt(d.offer)}</strong></li>`
  ).join('');
  const imagePayload = {
    mode: 'deal',
    dealAmount: fmt(state.dealAcceptedValue),
    caseLabel: `Case #${held.num} stays sealed`,
    revealedPlayer: null, revealedValue: null
  };

  inner.innerHTML = `
    <p class="finale-eyebrow">The Vault</p>
    <p class="finale-title">Deal!</p>
    <div class="hero-reveal-wrap" id="dealHeroWrap">
      <div class="hero-reveal is-yours">
        <p class="hero-tag">You banked</p>
        <p class="hero-value">${fmt(state.dealAcceptedValue)}</p>
        <p class="hero-player">Case #${held.num} stays sealed</p>
      </div>
    </div>
    <div class="panel-actions" style="justify-content:center;">
      <button id="revealHeldBtnOverlay">Reveal your case anyway</button>
      ${state.declinedOffers.length ? '<button id="viewHistoryBtnOverlay">View offer history</button>' : ''}
      <button id="shareResultBtnOverlay" ${navigator.share ? '' : 'style="display:none;"'}>Share</button>
      <button id="copyResultBtnOverlay">Copy result</button>
      <button class="primary" id="playAgainBtnOverlay">Play again</button>
    </div>
    ${state.declinedOffers.length ? `
      <div class="finale-history hidden" id="finaleHistoryOverlay">
        <h4>Offers you passed on</h4>
        <ul class="history-list">${historyRows}</ul>
      </div>
    ` : ''}
  `;
  overlay.classList.remove('hidden');

  document.getElementById('playAgainBtnOverlay').onclick = () => {
    overlay.classList.add('hidden');
    startGame(state.editBoard);
  };
  document.getElementById('shareResultBtnOverlay').onclick = (e) => shareResultImage(imagePayload, dealtShareText, e.target);
  document.getElementById('copyResultBtnOverlay').onclick = (e) => doCopy(dealtShareText, e.target);
  if(state.declinedOffers.length){
    document.getElementById('viewHistoryBtnOverlay').onclick = (e) => {
      const hist = document.getElementById('finaleHistoryOverlay');
      hist.classList.toggle('hidden');
      e.target.textContent = hist.classList.contains('hidden') ? 'View offer history' : 'Hide offer history';
    };
  }
  document.getElementById('revealHeldBtnOverlay').onclick = (e) => {
    state.heldRevealed = true;
    imagePayload.revealedPlayer = held.player;
    imagePayload.revealedValue = fmt(held.value);
    document.getElementById('dealHeroWrap').insertAdjacentHTML('beforeend', `
      <div class="hero-reveal is-passed">
        <p class="hero-tag">Case #${held.num} — what was inside</p>
        <p class="hero-value">${fmt(held.value)}</p>
        <p class="hero-player">${held.player}</p>
      </div>
    `);
    e.target.remove();
  };
}

function declineDeal(){
  state.declinedOffers.push({ round: state.roundIndex+1, offer: state.currentOffer });
  state.roundIndex++;
  state.casesOpenedThisRound = 0;

  const remainingUnopened = state.cases.filter(x=>!x.opened && x.num!==state.heldCaseNum);
  if(state.roundIndex >= ROUND_SCHEDULE.length || remainingUnopened.length <= 1){
    state.phase = 'final';
  } else {
    state.phase = 'playing';
  }
  render();
}

/* ---------------------------------------------------------------
   INIT
------------------------------------------------------------------*/
document.getElementById('homeLogo').addEventListener('click', goHome);
render();
loadPresetIndex();
initAuth();
</script>
